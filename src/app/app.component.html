<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div class="d-flex align-items-baseline gap-3">
      <h1 class="h3 mb-0">Lista zadań</h1>
      <span class="text-muted small">Zarządzaj zadaniami, sprawdzaj status i szczegóły.</span>
    </div>
    <button class="btn btn-primary" (click)="openModal()">Dodaj zadanie</button>
  </div>

  <app-task-filters (filtersChanged)="applyFilters($event)"></app-task-filters>

  <app-task-list [tasks]="filteredTasks" (toggleCompleted)="toggleCompleted($event)"></app-task-list>

  @if (showModal) {
    <app-task-form-modal (save)="addTask($event)" (cancel)="closeModal()"></app-task-form-modal>
    <div class="modal-backdrop fade show"></div>
  }
</div>
